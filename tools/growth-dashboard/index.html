<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wisdom growth dashboard</title>
<style>
.viz-root{
  color-scheme:light;
  --bg:#f6f5f2; --surface-1:#fcfcfb; --border:#e4e2dc;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#7a7873;
  --grid:#ecebe7; --series-1:#2a78d6; --series-1-soft:#cde2fb; --series-2:#eb6834;
  --good:#0ca30c; --warn:#b97f00; --crit:#d03b3b; --track:#efeee9;
}
@media (prefers-color-scheme:dark){
  :root:where(:not([data-theme="light"])) .viz-root{
    color-scheme:dark;
    --bg:#121211; --surface-1:#1a1a19; --border:#2e2e2b;
    --text-primary:#f0efec; --text-secondary:#c3c2b7; --text-muted:#8f8e86;
    --grid:#2a2a27; --series-1:#3987e5; --series-1-soft:#184f95; --series-2:#d95926;
    --good:#0ca30c; --warn:#fab219; --crit:#e66767; --track:#262624;
  }
}
:root[data-theme="dark"] .viz-root{
  color-scheme:dark;
  --bg:#121211; --surface-1:#1a1a19; --border:#2e2e2b;
  --text-primary:#f0efec; --text-secondary:#c3c2b7; --text-muted:#8f8e86;
  --grid:#2a2a27; --series-1:#3987e5; --series-1-soft:#184f95; --series-2:#d95926;
  --good:#0ca30c; --warn:#fab219; --crit:#e66767; --track:#262624;
}
*{box-sizing:border-box}
html,body{margin:0}
.viz-root{background:var(--bg);color:var(--text-primary);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;min-height:100vh;padding:28px 20px 60px}
.wrap{max-width:1120px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:15px;margin:0 0 2px}
h3{font-size:13px;margin:0 0 10px;color:var(--text-secondary);font-weight:600}
.sub{color:var(--text-secondary);font-size:13px}
.muted{color:var(--text-muted);font-size:12px}
.tabs{display:flex;gap:4px;background:var(--surface-1);border:1px solid var(--border);border-radius:10px;padding:3px}
.tabs button{border:0;background:transparent;color:var(--text-secondary);font:inherit;font-size:13px;padding:6px 12px;border-radius:7px;cursor:pointer}
.tabs button.on{background:var(--bg);color:var(--text-primary);font-weight:600}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:860px){.g4{grid-template-columns:1fr 1fr}.g2,.g3{grid-template-columns:1fr}}
.card{background:var(--surface-1);border:1px solid var(--border);border-radius:14px;padding:16px 18px}
.section{margin-top:26px}
.section-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;gap:12px;flex-wrap:wrap}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}
@media(max-width:860px){.hero{grid-template-columns:1fr}}
.big{font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1.05}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.01em;margin:4px 0 2px}
.kpi .l{font-size:12px;color:var(--text-secondary);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px;border:1px solid var(--border);color:var(--text-secondary)}
.pill i{width:7px;height:7px;border-radius:50%;display:inline-block}
.bar{height:10px;background:var(--track);border-radius:99px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--series-1);border-radius:99px}
.prog-row{display:flex;justify-content:space-between;font-size:12px;color:var(--text-secondary);margin:12px 0 5px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;padding:0 8px 8px 0;border-bottom:1px solid var(--border)}
td{padding:9px 8px 9px 0;border-bottom:1px solid var(--grid);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
th.n{text-align:right}
.funnel .row{display:grid;grid-template-columns:minmax(140px,1.2fr) 72px 1.6fr 58px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--grid)}
.funnel .row:last-child{border-bottom:0}
.funnel .name{font-size:13px}
.funnel .cnt{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.funnel .pct{text-align:right;font-size:12px;color:var(--text-secondary);font-variant-numeric:tabular-nums}
.funnel .row.leak .pct{color:var(--crit);font-weight:700}
.funnel .hdr{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.obsess td:first-child{width:28px;color:var(--text-muted);font-weight:700}
.status{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;white-space:nowrap}
.status svg{flex:none}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--text-primary);color:var(--surface-1);font-size:12px;padding:6px 8px;border-radius:7px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .08s}
.note{font-size:12px;color:var(--text-secondary);margin-top:8px}
.fix li{margin:0 0 8px}
.fix b{font-weight:600}
.legend{display:flex;gap:14px;font-size:12px;color:var(--text-secondary);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.split{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:2px;margin:10px 0 8px}
.split span{display:block;height:100%}
.hidden{display:none}
</style>
</head>

/* funnels */
function funnel(el,rows){
  let worst=-1,wv=2;rows.forEach((r,i)=>{if(i>0&&rows[i-1][1]>0&&r[1]<=rows[i-1][1]){const c=r[1]/rows[i-1][1];if(c<wv){wv=c;worst=i}}});
  const max=rows[0][1];
  el.innerHTML=`<div class="row hdr"><span>Step</span><span style="text-align:right">Users</span><span>Share of first step</span><span style="text-align:right">Step conv.</span></div>`+
  rows.map((r,i)=>{const wd=max?Math.max(r[1]/max*100,r[1]?1.2:0):0;const p=i===0?'':(rows[i-1][1]?(r[1]>rows[i-1][1]?'n/a':Math.round(r[1]/rows[i-1][1]*1000)/10+'%'):'n/a');
   return `<div class="row${i===worst?' leak':''}" title="${r[0]}: ${fmt(r[1])}"><span class="name">${r[0]}${muted(r[2])}</span><span class="cnt">${fmt(r[1])}</span><span class="bar"><span style="width:${wd}%"></span></span><span class="pct">${p}</span></div>`}).join('');
}
FUN.forEach(([id,rows])=>funnel(document.getElementById(id),rows));

/* charts */
function niceMax(m){if(m<=0)return 4;const p=Math.pow(10,Math.floor(Math.log10(m)));const n=m/p;const s=n<=1?1:n<=2?2:n<=4?4:n<=5?5:10;return s*p*(m/(s*p)>0.9?1.25:1)}
function chart(el,labels,series,opt){
  const W=520,H=opt.h||190,P={l:38,r:12,t:12,b:26};
  const all=series.flatMap(s=>s.v);let mx=opt.max||niceMax(Math.max(...all,0)*1.1);if(!opt.max){const st=mx/4;mx=Math.ceil(mx/st)*st}
  const n=labels.length;
  const bw=opt.bar?Math.min(26,(W-P.l-P.r)/n*0.55):0;
  const X=i=>opt.bar?P.l+bw/2+i*((W-P.l-P.r-bw)/Math.max(n-1,1)):(n===1?(P.l+W-P.r)/2:P.l+i*(W-P.l-P.r)/(n-1));
  const y=v=>H-P.b-(v/mx)*(H-P.t-P.b);
  let g='';for(let k=0;k<=4;k++){const v=mx*k/4,yy=y(v);g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${yy}" y2="${yy}" stroke="var(--grid)"/><text x="${P.l-6}" y="${yy+4}" text-anchor="end" font-size="10" fill="var(--text-muted)">${opt.pct?Math.round(v)+'%':(v>=1000?(v/1000).toFixed(v%1000?1:0)+'k':Math.round(v))}</text>`}
  const every=Math.ceil(n/10);labels.forEach((l,i)=>{if(i%every===0||i===n-1)g+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--text-muted)">${l}</text>`});
  let m='';
  series.forEach(s=>{
    if(opt.bar){s.v.forEach((v,i)=>{const hh=H-P.b-y(v);const r=Math.min(4,hh/2);const x0=X(i)-bw/2,y0=y(v);m+=hh>0?`<path d="M${x0},${H-P.b} V${y0+r} Q${x0},${y0} ${x0+r},${y0} H${x0+bw-r} Q${x0+bw},${y0} ${x0+bw},${y0+r} V${H-P.b} Z" fill="${s.c}"/>`:''})}
    else{if(n>1)m+=`<path d="${s.v.map((v,i)=>(i?'L':'M')+X(i)+','+y(v)).join(' ')}" fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
      const li=s.v.length-1;m+=`<circle cx="${X(li)}" cy="${y(s.v[li])}" r="4" fill="${s.c}" stroke="var(--surface-1)" stroke-width="2"/>`}
  });
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${opt.aria||''}">${g}${m}<line class="xh" y1="${P.t}" y2="${H-P.b}" stroke="var(--text-muted)" stroke-dasharray="3 3" opacity="0"/><rect x="${P.l}" y="0" width="${W-P.l-P.r}" height="${H}" fill="transparent"/></svg><div class="tip"></div>`;
  const svg=el.querySelector('svg'),tip=el.querySelector('.tip'),xh=el.querySelector('.xh');
  svg.addEventListener('mousemove',e=>{const r=svg.getBoundingClientRect();const px=(e.clientX-r.left)/r.width*W;let i=0,b=1e9;labels.forEach((_,k)=>{const d=Math.abs(X(k)-px);if(d<b){b=d;i=k}});
    xh.setAttribute('x1',X(i));xh.setAttribute('x2',X(i));xh.setAttribute('opacity',opt.bar?0:1);
    tip.innerHTML=`<b>${opt.tipLabel?opt.tipLabel(i):labels[i]}</b><br>`+series.map(s=>`${s.n}: ${fmt(s.v[i])}${opt.pct?'%':''}${s.extra?s.extra(i):''}`).join('<br>');
    tip.style.left=(X(i)/W*r.width)+'px';tip.style.top=(y(Math.max(...series.map(s=>s.v[i])))/H*r.height)+'px';tip.style.opacity=1});
  svg.addEventListener('mouseleave',()=>{tip.style.opacity=0;xh.setAttribute('opacity',0)});
}
CH.forEach(([id,l,s,o])=>chart(document.getElementById(id),l,s,o));
