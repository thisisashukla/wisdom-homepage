<!--
  BRANDED EXPLORATION TEMPLATE - wisdom-homepage
  Chrome adapted from frontend/src/app/home.css tokens onto light paper.
  Generated 2026-09-04. See _brand.md for token derivation.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ TITLE }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --brand-ink: #3d0c0c; --brand-ink-soft: #5c1a1a;
      --brand-accent: #a86a12; --brand-accent-soft: #f2d78a;
      --paper: #fbf5ea; --paper-2: #f4ecd9;
      --line: rgba(61, 12, 12, 0.14); --line-soft: rgba(61, 12, 12, 0.06);
      --ink-body: #2a0808; --ink-mute: rgba(61, 12, 12, 0.62); --ink-mute-2: rgba(61, 12, 12, 0.42);
      --shadow-md: 0 6px 28px -12px rgba(61, 12, 12, 0.18), 0 2px 6px rgba(61, 12, 12, 0.05);
    }
    * { box-sizing: border-box; } html, body { margin: 0; padding: 0; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--paper); color: var(--ink-body); -webkit-font-smoothing: antialiased; line-height: 1.55; }
    .page { max-width: 1320px; margin: 0 auto; padding: 72px 48px 160px; }
    .doc-header { border-bottom: 1px solid var(--line); padding-bottom: 40px; margin-bottom: 80px; }
    .doc-eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--brand-accent); background: rgba(168, 106, 18, 0.10); padding: 6px 12px; border-radius: 999px; margin-bottom: 22px; }
    .doc-eyebrow::before { content: ''; width: 6px; height: 6px; border-radius: 999px; background: var(--brand-accent); }
    .doc-title { font-family: 'Playfair Display', Georgia, serif; font-size: 54px; line-height: 1.05; font-weight: 600; letter-spacing: -0.015em; margin: 0 0 16px; color: var(--brand-ink); }
    .doc-title em { font-style: italic; color: var(--brand-ink-soft); }
    .doc-subtitle { font-size: 19px; color: var(--ink-mute); max-width: 780px; margin: 0 0 32px; line-height: 1.5; }
    .doc-meta { display: flex; flex-wrap: wrap; gap: 24px; font-size: 13px; color: var(--ink-mute-2); }
    .doc-meta > div { display: flex; gap: 6px; } .doc-meta b { color: var(--brand-ink-soft); font-weight: 600; }
    .variant { margin-bottom: 96px; } .variant:last-of-type { margin-bottom: 40px; }
    .variant-head { display: grid; grid-template-columns: 64px 1fr; gap: 20px; align-items: start; margin-bottom: 28px; }
    .variant-letter { width: 48px; height: 48px; border-radius: 999px; background: var(--brand-ink); color: var(--brand-accent-soft); font-family: 'Playfair Display', Georgia, serif; font-weight: 600; font-size: 22px; display: flex; align-items: center; justify-content: center; letter-spacing: -0.02em; }
    .variant-meta h2 { margin: 4px 0 6px; font-family: 'Playfair Display', Georgia, serif; font-size: 28px; font-weight: 600; letter-spacing: -0.015em; color: var(--brand-ink); }
    .variant-tradeoff { font-size: 15px; color: var(--ink-mute); margin: 0; max-width: 820px; }
    .variant-tradeoff b { color: var(--brand-accent); font-weight: 700; }
    .preview-frame { background: #ffffff; border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow-md); overflow: hidden; margin-left: 84px; position: relative; }
    .preview-frame::before { content: ''; position: absolute; top: 14px; left: 16px; width: 10px; height: 10px; border-radius: 999px; background: #ead9b8; box-shadow: 18px 0 0 #ead9b8, 36px 0 0 #ead9b8; z-index: 2; }
    .preview-frame-bar { background: #faf3e2; border-bottom: 1px solid var(--line-soft); padding: 14px 16px 14px 76px; font-size: 11px; letter-spacing: 0.10em; text-transform: uppercase; color: var(--ink-mute-2); font-weight: 700; }
    .preview { padding: 0; min-height: 200px; }
    .variant-analysis { margin: 24px 0 0 84px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
    .analysis-block { padding: 18px 20px; border: 1px solid var(--line); border-radius: 12px; background: #fffdf7; }
    .analysis-block h4 { margin: 0 0 6px; font-size: 11px; font-weight: 700; letter-spacing: 0.10em; text-transform: uppercase; color: var(--brand-accent); }
    .analysis-block.is-risk h4 { color: #a03a1a; } .analysis-block.is-pick h4 { color: #4a6b2a; }
    .analysis-block p { margin: 0; font-size: 14px; line-height: 1.55; color: var(--ink-mute); }
    .decision { margin-top: 80px; padding: 44px 48px; background: var(--brand-ink); color: var(--brand-accent-soft); border-radius: 22px; }
    .decision h3 { font-family: 'Playfair Display', Georgia, serif; font-size: 30px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 8px; color: var(--brand-accent-soft); }
    .decision-sub { color: rgba(242, 215, 138, 0.65); font-size: 14px; margin: 0 0 28px; }
    .decision-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
    .decision-cell b { display: block; font-size: 12px; letter-spacing: 0.10em; text-transform: uppercase; color: rgba(242, 215, 138, 0.85); margin-bottom: 6px; font-weight: 700; }
    .decision-cell span { font-size: 15px; color: rgba(255, 250, 240, 0.85); line-height: 1.5; }
    @media (max-width: 900px) { .page { padding: 40px 20px 80px; } .doc-title { font-size: 36px; } .variant-head { grid-template-columns: 48px 1fr; gap: 12px; } .preview-frame { margin-left: 0; } .variant-analysis { margin-left: 0; grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="page">
    <header class="doc-header">
      <div class="doc-eyebrow">Design exploration</div>
      <h1 class="doc-title">{{ TITLE }}</h1>
      <p class="doc-subtitle">{{ SUBTITLE }}</p>
      <div class="doc-meta">
        <div><b>Surface</b> {{ SURFACE }}</div>
        <div><b>Source</b> {{ SPEC_PATH }}</div>
        <div><b>Generated</b> {{ DATE }}</div>
      </div>
    </header>
  </main>
</body>
</html>
